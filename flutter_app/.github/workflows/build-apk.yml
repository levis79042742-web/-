name: Build Trend7 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true

      - name: Create Android platform files if missing
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org com.trend7.app .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Run Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ secrets.TREND7_API_BASE_URL }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trend7-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
